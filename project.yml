name: Pilote
options:
  bundleIdPrefix: io.github.pjksens
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en        # repli de la langue pour tout Mac qui n'est ni français, ni anglais, ni espagnol
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Signature locale. Pour que macOS garde les autorisations (Rappels, Calendrier, Mail) d'une version à l'autre,
    # mettez votre équipe Apple : DEVELOPMENT_TEAM: <votre équipe> et CODE_SIGN_IDENTITY: "Apple Development".
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Pilote:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pjksens.pilote
        PRODUCT_NAME: Pilote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pilote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: Sacha Praljak
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Pilote affiche vos rappels du jour et vous permet de les cocher."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Pilote affiche vos rendez-vous du jour."
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Pilote lit vos échanges avec vos contacts dans Mail et y prépare des brouillons. Il n'envoie jamais rien."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES                       # le compilateur relève les textes dans App/Localizable.xcstrings
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  pilote:
    type: tool
    platform: macOS
    sources: [CLI, Shared]
    settings:
      base:
        PRODUCT_NAME: pilote
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pjksens.pilote.cli
  PiloteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - App/Localizable.xcstrings      # les tests lisent le catalogue compilé (langue réglée par Loc)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pjksens.pilote.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: EssaiPrincipal
